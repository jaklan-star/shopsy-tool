<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipkart → Shopsy Resolver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>Flipkart → Shopsy Smart Resolver 🚀</h2>

<textarea id="input" placeholder="Paste affiliate / short / flipkart link"></textarea>
<button onclick="resolve()">Resolve</button>
<div id="status"></div>
<textarea id="output" readonly placeholder="Converted link"></textarea>

<div class="row">
<button onclick="copy()">Copy</button>
<button onclick="openLink()">Open</button>
<button onclick="clearAll()">Clear</button>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
